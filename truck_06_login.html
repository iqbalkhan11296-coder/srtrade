<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111c2e">
<title>SR TRADE LINK | Truck 06 Driver Portal</title>
<style>
:root{--navy:#111c2e;--navy2:#203550;--gold:#d6ad61;--bg:#f3f5f8;--text:#172235;--muted:#718096}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at 50% 0%,#e5ebf3 0,#f3f5f8 55%);color:var(--text);display:grid;place-items:center;padding:22px}
.portal{width:min(100%,430px);background:#fff;border:1px solid #e3e8ef;border-radius:22px;box-shadow:0 22px 60px #17223518;overflow:hidden}
.top{background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;padding:30px 26px 27px;text-align:center}
.logo{width:62px;height:62px;margin:0 auto 16px;border-radius:17px;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-weight:900;font-size:24px;letter-spacing:-1px;box-shadow:0 8px 22px #0002}
.brand{font-size:20px;font-weight:850;letter-spacing:2px;margin:0}
.tagline{display:block;color:#c5cfdb;font-size:10px;letter-spacing:3px;margin-top:6px}
.content{padding:30px 26px 27px;text-align:center}
.eyebrow{font-size:10px;font-weight:800;letter-spacing:2px;color:#8b6b35;text-transform:uppercase}
h1{font-size:27px;margin:9px 0 7px;color:var(--navy)}
.desc{font-size:13px;line-height:1.6;color:var(--muted);margin:0 auto 24px;max-width:290px}
.truck{border:1px solid #e5eaf0;background:#f7f9fc;border-radius:15px;padding:17px;margin-bottom:22px}
.truck-icon{font-size:29px;line-height:1;margin-bottom:8px}
.truck-name{font-size:19px;font-weight:850;color:var(--navy);letter-spacing:.5px}
.truck-sub{font-size:11px;color:var(--muted);margin-top:4px}
.enter{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:15px 18px;border:0;border-radius:11px;background:var(--navy);color:#fff;font-size:14px;font-weight:800;text-decoration:none;box-shadow:0 8px 18px #111c2e22;transition:transform .15s,background .15s}
.enter:hover{background:#203550;transform:translateY(-1px)}
.enter:active{transform:translateY(0)}
.note{font-size:10px;color:#8994a3;margin:17px 0 0}
.footer{border-top:1px solid #edf0f4;padding:15px 20px;text-align:center;color:#8994a3;font-size:10px;letter-spacing:.4px}
@media(max-width:380px){.content{padding:25px 20px}.top{padding:26px 20px}h1{font-size:24px}}
</style>
</head>
<body>
<main class="portal">
  <header class="top">
    <div class="logo">SR</div>
    <p class="brand">SR TRADE LINK</p>
    <span class="tagline">DRIVER PORTAL</span>
  </header>
  <section class="content">
    <div class="eyebrow">Welcome back</div>
    <h1>Driver Access</h1>
    <p class="desc">Your truck workspace is ready. Tap below to open your assigned truck dashboard.</p>
    <div class="truck">
      <div class="truck-icon" aria-hidden="true">🚚</div>
      <div class="truck-name">Truck 06</div>
      <div class="truck-sub">Assigned Driver Dashboard</div>
    </div>
    <a class="enter" href="truck_06.html">Enter Dashboard <span aria-hidden="true">→</span></a>
    <p class="note">No password required</p>
  </section>
  <footer class="footer">SR TRADE LINK · DRIVER ACCESS</footer>
</main>
</body>
</html>
